<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Asistente de postulación</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="cabecera">
    <div class="marca"><img src="iconos/48.png" alt=""></div>
    <div class="titulo">
      <h1>Asistente</h1>
      <p id="linea" class="linea"><span class="punto"></span><span id="linea-texto">Sin vincular</span></p>
    </div>
    <button id="pausar" class="neon" type="button" hidden>
      <svg class="icono-pausa" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4" width="4" height="16" rx="2"/><rect x="14.5" y="4" width="4" height="16" rx="2"/></svg>
      <svg class="icono-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.6v14.8a1 1 0 0 0 1.53.85l11.8-7.4a1 1 0 0 0 0-1.7L8.53 3.75A1 1 0 0 0 7 4.6z"/></svg>
    </button>
  </header>

  <section id="sin-vincular" class="bloque" hidden>
    <p>Vincula este navegador desde el bot con <b>/vincular</b>, o escribe aquí el código que te dio:</p>
    <form id="form-codigo" class="codigo">
      <input id="codigo" maxlength="9" placeholder="ABCD-2345" autocomplete="off" spellcheck="false" required>
      <button type="submit">Vincular</button>
    </form>
    <p id="mensaje-codigo" class="mensaje"></p>
  </section>

  <p id="actual" class="aviso trabajando" hidden></p>
  <p id="actualizar" class="aviso alerta" hidden>Hay una versión nueva de la extensión. Actualízala para seguir postulando.</p>

  <div class="seccion">
    <span>Portales</span>
    <button id="revisar" class="enlace" type="button" hidden>Revisar</button>
  </div>
  <ul id="portales" class="portales"></ul>

  <footer class="pie">
    <p id="ultima" class="ultima"></p>
    <p class="nota">Inicias sesión en la página de cada portal; la extensión nunca ve tu contraseña.</p>
    <a href="opciones.html" target="_blank">Opciones</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
