[project]
name = "buscador-vacantes"
version = "0.1.0"
description = "Buscador de vacantes de prácticas, aprendiz y junior TI que publica en Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Windows no trae la base de zonas horarias que usa zoneinfo (America/Bogota)
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
]
# Asistente de postulación (bot, API y CV): uv sync --group asistente
asistente = [
    "cryptography>=43",
    "fastapi>=0.115",
    "fpdf2>=2.8",
    "pypdf>=5.0",
    "python-telegram-bot>=21.6",
    "uvicorn>=0.32",
]
# Pruebas de la extensión en Chromium (solo desarrollo): uv sync --group navegador
navegador = [
    "playwright>=1.48",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["navegador: pruebas de la extensión en Chromium (uv sync --group navegador)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Dependencias declaradas de FastAPI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
