# Presupuesto = requests máximos por corrida (cada página cuenta). reservado_nucleo =
# palabras clave del núcleo por corrida; paginas_nucleo = páginas leídas de cada una (solo
# en fuentes que paginan). El resto del presupuesto avanza la cola larga (solo página 1).
# En fuentes sin filtro de nivel nativo, reservado_nucleo × paginas_nucleo ≥ presupuesto / 2.
fuentes:
  linkedin:
    activa: true
    presupuesto: 3
    reservado_nucleo: 2
    filtra_nivel: true   # f_E=1,2: solo prácticas y nivel de entrada
    opciones:
      location: Colombia
      f_E: "1,2"        # Prácticas y nivel de entrada
      f_TPR: r86400     # Últimas 24 h
  computrabajo:
    activa: true
    presupuesto: 8
    reservado_nucleo: 2
    paginas_nucleo: 3    # la página 1 viene ordenada por relevancia, no por fecha
  elempleo:
    activa: true
    presupuesto: 5
    reservado_nucleo: 2
    paginas_nucleo: 2
    opciones:
      filtro_fecha: hace-1-semana   # ruta del filtro "Fecha de publicación"
  magneto:
    activa: true
    presupuesto: 4
    reservado_nucleo: 2   # ya ordena por fecha de publicación: basta la página 1
  getonboard:
    activa: true
    presupuesto: 5
    reservado_nucleo: 1
    filtra_nivel: true   # solo seniorities sin experiencia y junior
    opciones:
      por_pagina: 50
      # Filtro de nivel nativo (la API no filtra en el servidor: se aplica al parsear)
      seniorities: [no_experience, junior]
      # Las remotas en inglés quedan fuera del alcance (remoto LATAM en español)
      excluir_remoto_en_ingles: true
  spe:
    activa: true
    presupuesto: 2       # páginas de 50 plazas, las más recientes primero
    reservado_nucleo: 1
    filtra_nivel: true   # PLAZA_PRACTICA=1: solo plazas de práctica
    nota: >-
      Servicio Público de Empleo (buscadordeempleo.gov.co). No usa las palabras clave: pide
      las plazas de práctica más recientes. Las copias de elempleo y Magneto se identifican
      con la clave de su portal de origen. Los datos llegan con días de retraso.
    opciones:
      # Bolsas cuyo enlace de detalle exige iniciar sesión: esas plazas se descartan
      dominios_con_login:
        - symplicity.com
        - coallytalent.com
        - oficia.uniandes.edu.co
        - talentumsabana.unisabana.edu.co
  torre:
    activa: false
    presupuesto: 5
    reservado_nucleo: 1
    nota: >-
      Desactivada (2026-10-03). La API pública search.torre.co ya no acepta búsquedas
      ("Invalid request") y la nueva solo funciona desde la app web con la cabecera de
      identidad X-Torre-GgId; integrarla exigiría depender de un identificador de sesión.
  sena:
    activa: false
    presupuesto: 3
    reservado_nucleo: 1
    nota: >-
      Desactivada (2026-10-03). La consulta de vacantes de la Agencia Pública de Empleo
      (agenciapublicadeempleo.sena.edu.co) redirige a /spe/login: exige iniciar sesión.
      El portal ape.sena.edu.co no tiene buscador público. Las vacantes SENA siguen
      llegando por "aprendiz SENA" en LinkedIn, Computrabajo, elempleo y Magneto.

