# Configuración funcional del buscador de vacantes.
# Los secretos (token, claves, ids de chat, URL de healthchecks) van en .env, nunca aquí.
# Los términos se comparan en minúsculas, sin tildes y con límites de palabra,
# así que pueden escribirse con tildes y mayúsculas.

zona_horaria: America/Bogota

rutas:
  base_datos: data/vacantes.db
  logs: logs
  lock: data/buscador.lock

registro:
  retencion_dias: 14

red:
  timeout_s: 20
  pausa_min_s: 4
  pausa_max_s: 10
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
  accept_language: "es-CO,es;q=0.9,en;q=0.6"
  # Escalones de cooldown ante 429/999/403 o desafío anti-bot (1.º, 2.º y 3.º en adelante)
  cooldown_horas: [2, 6, 24]
  marcadores_desafio:
    - captcha
    - cf-chl
    - challenge
    - are you a robot
    - unusual traffic

palabras_clave:
  # Consultas amplias: se repiten en cada ciclo corto (reservado_nucleo por fuente)
  nucleo:
    - practicante sistemas
    - practicante TI
    - aprendiz SENA
    - aprendiz sistemas
    - pasante tecnología
    - trainee tecnología
    - junior TI
    - desarrollador junior
  # Consultas específicas por rol: se recorren en rotación con el resto del presupuesto
  cola_larga:
    desarrollo:
      - programador junior
      - desarrollador backend junior
      - desarrollador frontend junior
      - desarrollador fullstack junior
      - desarrollador Java junior
      - desarrollador Python junior
      - desarrollador .NET junior
      - desarrollador web junior
      - desarrollador móvil junior
      - practicante desarrollo
      - aprendiz desarrollo de software
      - tecnólogo desarrollo de software
    infraestructura:
