      - cloud junior
      - AWS junior
      - Azure junior
      - SysOps
      - CloudOps
      - infraestructura junior
      - administrador de sistemas junior
      - Linux junior
      - aprendiz infraestructura
    redes:
      - redes junior
      - técnico de redes
      - telecomunicaciones junior
      - NOC junior
      - aprendiz redes
    bases_datos:
      - DBA junior
      - administrador de bases de datos junior
      - SQL junior
      - aprendiz bases de datos
    soporte:
      - soporte técnico junior
      - soporte IT
      - mesa de ayuda
      - helpdesk
      - auxiliar de sistemas
      - auxiliar TI
      - técnico de sistemas
      - aprendiz soporte
    datos:
      - analista de datos junior
      - data analyst junior
      - BI junior
      - Power BI
      - ingeniero de datos junior
      - practicante análisis de datos
      - aprendiz análisis de datos
    qa:
      - QA junior
      - tester junior
      - analista de pruebas junior
      - automatización de pruebas junior
    ciberseguridad:
      - ciberseguridad junior
      - analista SOC junior
      - seguridad informática junior
    general:
      - analista de sistemas junior
      - analista TI junior
      - ingeniero de sistemas recién egresado
      - estudiante ingeniería de sistemas
      - semillero
      - programa de talento
      - contrato de aprendizaje
      - etapa productiva
      - internship
      - intern
      - entry level developer

# Presupuesto = requests máximos por corrida. reservado_nucleo = parte del presupuesto
# para el grupo núcleo; el resto avanza la cola larga.
fuentes:
  linkedin:
    activa: true
    presupuesto: 3
    reservado_nucleo: 1
    filtra_nivel: true   # f_E=1,2: solo prácticas y nivel de entrada
    opciones:
      location: Colombia
      f_E: "1,2"        # Prácticas y nivel de entrada
      f_TPR: r86400     # Últimas 24 h
  computrabajo:
    activa: true
    presupuesto: 4
    reservado_nucleo: 1
  elempleo:
    activa: true
    presupuesto: 3
    reservado_nucleo: 1
    opciones:
      filtro_fecha: hace-1-semana   # ruta del filtro "Fecha de publicación"
  magneto:
    activa: true
    presupuesto: 3
    reservado_nucleo: 1
  getonboard:
    activa: true
    presupuesto: 5
    reservado_nucleo: 1
    filtra_nivel: true   # solo seniorities sin experiencia y junior
    opciones:
      por_pagina: 50
      # Filtro de nivel nativo (la API no filtra en el servidor: se aplica al parsear)
      seniorities: [no_experience, junior]
      # Las remotas en inglés quedan fuera del alcance (remoto LATAM en español)
      excluir_remoto_en_ingles: true
  torre:
    activa: false
    presupuesto: 5
    reservado_nucleo: 1
    nota: >-
      Desactivada (2026-10-03). La API pública search.torre.co ya no acepta búsquedas
      ("Invalid request") y la nueva solo funciona desde la app web con la cabecera de
      identidad X-Torre-GgId; integrarla exigiría depender de un identificador de sesión.
  sena:
    activa: false
    presupuesto: 3
    reservado_nucleo: 1
    nota: >-
      Desactivada (2026-10-03). La consulta de vacantes de la Agencia Pública de Empleo
      (agenciapublicadeempleo.sena.edu.co) redirige a /spe/login: exige iniciar sesión.
      El portal ape.sena.edu.co no tiene buscador público. Las vacantes SENA siguen
      llegando por "aprendiz SENA" en LinkedIn, Computrabajo, elempleo y Magneto.

