telegram:
  # bot_api: Bot API directa con el token del bot de Hermes (preferido)
  # hermes_cli: respaldo con `hermes send`
  modo: bot_api
  # Si TELEGRAM_BOT_TOKEN no está en .env, se lee de aquí en cada corrida.
  # Ruta por confirmar en la tarea 1.3.
  token_hermes:
    archivo: ~/.hermes/.env
    variable: TELEGRAM_BOT_TOKEN
  hermes_comando: hermes
  timeout_s: 20

banner:
  modo: diario   # diario | nunca | siempre
  imagen: assets/encabezado_vacantes.jpg

ia:
  base_url: https://api.deepseek.com
  modelo: deepseek-chat
  timeout_s: 60
  saldo_minimo_usd: 1.0
  saldo_cache_min: 10
  # Topes de llamadas diarias: amplios a propósito (la IA decide todas las dudosas y las
  # prácticas de otras áreas). La protección económica es saldo_minimo_usd
  presupuesto_dia:
    clasificador: 300
    reportero: 20
    resumen: 3      # un resumen al día; el margen cubre reintentos y pruebas

clasificador:
  activo: true
  max_vacantes_por_llamada: 30
  politica_sin_ia: descartar   # descartar | aceptar
  horas_vencimiento_pendiente: 24
  temperatura: 0
  prompt_sistema: |
    Eres el clasificador de un canal de Telegram de vacantes de prácticas, aprendizaje y
    nivel junior en tecnología (TI) para Colombia.

    Alcance que SÍ se acepta:
    - Roles de TI: desarrollo de software (backend, frontend, fullstack, móvil),
      infraestructura, DevOps, cloud y sysadmin, redes y telecomunicaciones, bases de datos,
      soporte IT y mesa de ayuda, análisis de datos, BI e ingeniería de datos, QA y testing,
      ciberseguridad, y análisis de sistemas o de TI.
    - Nivel: práctica, pasantía, aprendiz (incluido SENA), trainee, junior o entrada
      (sin experiencia o con hasta 2 años).
    - Ubicación: cualquier ciudad de Colombia, o remoto abierto a Colombia o a LATAM
      publicado en español.

    Se rechaza: roles que no son de TI (contables, administrativos, comerciales, de
    marketing, logística, etc.), cargos senior, de liderazgo o con 3 o más años de
    experiencia, y vacantes presenciales fuera de Colombia o remotas restringidas a otro país.

    Categorías válidas:
    - "practicas": cualquier rol de TI con nivel práctica, pasantía, aprendiz, trainee o
      etapa productiva.
    - Para nivel junior/entrada: "desarrollo", "infraestructura" (incluye DevOps, cloud y
      redes), "bases_datos", "soporte", "datos", "qa", "ciberseguridad" u "otros_ti".

    Nivel: si el título no indica el nivel (por ejemplo "Frontend Developer" o "Ingeniero de
    Infraestructura"), acéptala solo si hay evidencia de que es práctica, junior o de entrada:
    "nivel_filtrado_por_fuente" es true, la descripción lo dice o el salario es de entrada
    (en Colombia, más de unos 4,5 millones de pesos al mes suele indicar un cargo no junior).
    Sin evidencia, recházala.

    Aprendiz SENA genérico: si el título es solo "Aprendiz SENA" (o "Aprendiz", "Contrato de
    aprendizaje", "Etapa productiva/práctica") con ciudad, empresa o código, pero sin nombrar
    un área, ACÉPTALA con categoría "practicas", aunque no se mencione TI. Recházala si el
    título o la descripción indican un área o unas tareas que no son de TI: salud, farmacia,
    mecánica, retail, ventas, atención al cliente, cocina, tareas administrativas u
    operativas, logística, etc. Esta excepción es solo para aprendices SENA o de contrato de
    aprendizaje: un "Practicante" o "Estudiante en práctica" sin área sigue la regla general
    (se acepta solo si hay evidencia de TI).

    Práctica de otra área: también recibes prácticas, pasantías y aprendices cuyo título
    nombra un área que no es de TI ("Practicante administrativo", "Aprendiz de logística").
    Acéptala con categoría "practicas" solo si sus funciones principales son de TI
    (desarrollo, datos/BI, soporte técnico, redes, sistemas de información, automatización).
    Si lo de TI es secundario (manejo de Excel u Office, digitar en un ERP, "manejo de
    sistemas", redes sociales), recházala.

    Recibes un JSON con una lista "vacantes"; cada una tiene un "id". Responde SOLO con un
    JSON con esta forma, con una entrada por cada id recibido:
    {"vacantes": [{"id": 0, "aceptar": true, "categoria": "desarrollo", "motivo": "frase breve"}]}
    Si rechazas, usa "categoria": null. No inventes datos que no estén en la vacante.

reportero:
  activo: true
  temperatura: 0.2
  max_tokens: 700
  max_muestra_cuerpo: 3000
  prompt_sistema: |
    Eres un analista de incidentes de un scraper de vacantes de empleo.
    Recibes evidencia técnica de una o varias fuentes que fallaron, en una lista "incidentes".
    Responde SOLO con un JSON con una entrada por incidente, en el mismo orden:
    {"diagnosticos": [{
      "fuente": "nombre de la fuente",
      "tipo": "tipo de incidente",
      "severidad": "baja | media | alta",
      "causa_probable": "1-2 frases",
      "evidencia_clave": "qué dato del payload lo demuestra",
      "accion_recomendada": "qué debe hacer el administrador, concreto",
      "requiere_intervencion": true,
      "sugerencia_tecnica": "si es cambio de HTML, propone selectores nuevos basados en body_muestra; si no aplica, null"
    }]}
    Reglas: no inventes datos que no estén en el payload. Si la evidencia no alcanza
    para concluir, dilo en causa_probable. Nunca recomiendes evadir captchas,
    rotar proxies para esquivar bloqueos ni violar los términos del sitio;
    para bloqueos recomienda reducir frecuencia, presupuesto o desactivar la fuente.
    Escribe en español.

resumen:
  activo: true
  # La hora (08:00 Colombia) se define en deploy/buscador-resumen.timer
  temperatura: 0.3
  max_tokens: 900
  prompt_sistema: |
    Eres el analista de operación de un buscador de vacantes que publica en Telegram.
    Recibes SOLO métricas agregadas de las últimas 24 h (y algunos datos de 7 días).
    Responde SOLO con un JSON con esta forma:
    {"titular": "una frase con el balance del día",
     "recomendaciones": ["entre 1 y 3 recomendaciones concretas"]}
    Cada recomendación debe citar el dato que la justifica (por ejemplo, una palabra clave
    sin resultados en 7 días o un filtro que descarta una proporción inusual).
    No inventes datos que no estén en las métricas. Escribe en español.

incidentes:
  corridas_bloqueo: 2
  corridas_error_servidor: 3
  umbral_caida_volumen: 0.30
  horas_recordatorio: 24

estado:
  dias_vistas: 90
  dias_intentos: 30

salud:
  activo: true
  timeout_s: 10

operacion:
  timeout_corrida_min: 25

# Asistente de postulación (bot asistente, API para la extensión y CV adaptado).
# Plan: openspec/changes/asistente-postulacion-telegram. Desactivado hasta el piloto.
asistente:
  activo: false
  enlace_canal: false        # mostrar "⚡ Postularme" en las fichas (requiere activo)
  bot_usuario: ""            # @usuario del bot asistente, sin @
  dueno_telegram_id: 0       # id de Telegram del administrador
  base_datos: data/asistente.db
  archivos: data/asistente   # CV, PDF generados y evidencia (permisos 700)
  vacantes_db: null          # vacantes.db del buscador (solo lectura); null: rutas.base_datos
  api:
    host: 127.0.0.1
    puerto: 8787
    url_publica: ""          # https://<equipo>.<tailnet>.ts.net (Tailscale Funnel)
  extension:
    url_edge: ""             # enlace de la tienda de complementos de Edge
    version_minima: "1.0.0"
    latido_s: 30
    navegador_caido_min: 2
  grupo:
    chat_id: ""              # vacío: el TELEGRAM_CHAT_ID del buscador (el grupo privado)
    comprobar_cada_h: 24
    cache_min: 10
  politica:
    version: 1
    # Borrador de la tarea 2.2: el administrador debe revisarlo y aprobarlo antes del piloto.
    # Cambiar el texto exige subir la versión: todos los usuarios lo aceptan de nuevo.
    texto: |-
      AUTORIZACIÓN DE TRATAMIENTO DE DATOS PERSONALES
      Asistente de postulación del grupo JOBS - PRÁCTICAS/APRENDIZ

      Responsable: el administrador del grupo, quien opera este asistente en su propio
      servidor sin ánimo de lucro (Ley 1581 de 2012 y Decreto 1377 de 2013).

      1. Qué datos guardamos: tu id y nombre de Telegram; tu hoja de vida y el perfil que
      se arma con ella (formación, experiencia, proyectos, habilidades, idiomas); tus datos
      de contacto (correo, teléfono y, si lo das, tu documento); tus respuestas al
      cuestionario; el correo de tus cuentas de Computrabajo y Magneto; tu clave de Gemini
      (cifrada); y el historial de tus postulaciones con las respuestas enviadas.

      2. Para qué: solo para preparar y enviar las postulaciones que tú pidas tocando
      "Postularme" (o las de tu modo automático, si lo activas), adaptar levemente tu hoja
      de vida a cada vacante y mostrarte el resultado. No vendemos ni compartimos tus datos.

      3. Inteligencia artificial: usamos Gemini de Google con TU propia clave. En su plan
      gratuito, Google puede usar el contenido enviado para mejorar sus modelos. Por eso
      nunca enviamos tu documento, teléfono, correo ni dirección; solo tu formación,
      experiencia, habilidades y la vacante. Si tu hoja de vida es escaneada, te pediremos
      permiso antes de enviarla completa.

      4. Postulación desde tu navegador: la extensión postula desde tu computador, con tu
      sesión y tu conexión. Nunca recibimos tus contraseñas ni tus sesiones. Si lo
      autorizas, actualizará la hoja de vida de tus perfiles en los portales con la versión
      adaptada a cada vacante; una empresa a la que te postulaste antes podría ver la
      versión más reciente.

      5. Riesgo: los portales de empleo pueden restringir el uso automatizado de las
      cuentas. Para reducirlo postulamos con pausas, con un tope diario y nos detenemos ante
      cualquier verificación, pero no podemos garantizar que el portal no tome medidas.

      6. Tus derechos: conocer, actualizar, rectificar y suprimir tus datos y revocar esta
      autorización. Puedes ver y editar tu perfil con /perfil y borrar todo con /borrarme.
      Si dejas el grupo, tu acceso se suspende; si no usas el asistente en 12 meses, te
      avisaremos y luego borraremos tus datos.

      Al pulsar "Acepto" autorizas este tratamiento.
  cv:
    max_mb: 5
    max_paginas: 10
  topes:
    usuario_dia: 15          # postulaciones por usuario y día
    ia_usuario_dia: 60       # llamadas a Gemini por usuario y día
    mensajes_min: 30         # antiabuso
  ejecucion:
    pausa_s: {min: 45, max: 120}
    espera_navegador_h: 24
    espera_usuario_h: 12
    espera_sesion_h: 24
    espera_verificacion_h: 2
  plataformas:
    computrabajo: {automatica: true}
    magneto: {automatica: true}
  automatico_usuario:
    umbral_defecto: 70
  carta_max_caracteres: 1000
  recordatorio_dias: 2
  inactividad_meses: 12
  retencion_dias: 90
  evidencia_dias: 30
  detalle:
    intervalo_dominio_s: 5
    timeout_s: 15
    cache_h: 24
  # Preguntas típicas por fuente para el paquete de respaldo (se completan en la tarea 3.1)
  preguntas_tipicas:
    otras:
      - ¿Cuál es tu aspiración salarial?
      - ¿Cuál es tu disponibilidad para iniciar?
      - ¿Por qué te interesa esta vacante?
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta
    timeout_s: 60
    # Verificado el 2026-10-04 con GET /v1beta/models (tarea 4.1): los gemini-2.5-* ya no
    # están disponibles para cuentas nuevas (404). Se usan los alias -latest, que Google
    # mantiene apuntando al modelo vigente, con razonamiento "low" (thinkingLevel).
    # Modelos con generateContent en esa fecha: gemini-flash-latest, gemini-flash-lite-latest,
    # gemini-3.8-flash, gemini-3.5-flash, gemini-3.5-flash-lite, gemini-3.1-flash-lite.
    # Respaldo verificado el 2026-10-04: gemini-flash-latest (3.8) respondía 503 por alta
    # demanda mientras gemini-3.5-flash y los lite respondían bien.
    tareas:
      leer_cv:
        {modelo: gemini-flash-latest, temperatura: 0.1, max_tokens: 6000,
         respaldo: [gemini-3.5-flash, gemini-flash-lite-latest]}
      requisitos:
        {modelo: gemini-flash-lite-latest, temperatura: 0.1, max_tokens: 1500,
         respaldo: [gemini-3.1-flash-lite, gemini-3.5-flash-lite]}
      adaptar_cv:
        {modelo: gemini-flash-latest, temperatura: 0.3, max_tokens: 2500,
         respaldo: [gemini-3.5-flash, gemini-flash-lite-latest]}
      carta:
        {modelo: gemini-flash-latest, temperatura: 0.5, max_tokens: 1500,
         respaldo: [gemini-3.5-flash, gemini-flash-lite-latest]}
      responder:
        {modelo: gemini-flash-lite-latest, temperatura: 0.3, max_tokens: 1000,
         respaldo: [gemini-3.1-flash-lite, gemini-3.5-flash-lite]}
      clasificar_pregunta:
        {modelo: gemini-flash-lite-latest, temperatura: 0, max_tokens: 600,
         respaldo: [gemini-3.1-flash-lite, gemini-3.5-flash-lite]}
