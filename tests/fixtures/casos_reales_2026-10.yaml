# Casos reales: vacantes publicadas en el canal entre el 2026-10-10 y el 2026-10-13 (título,
# empresa y fuente tal como salieron en producción). La ubicación, la modalidad y la descripción
# son SUPUESTAS: producción no las guardaba (las tarjetas de LinkedIn y Computrabajo no traen
# descripción). Cada caso fija una condición del spec filtro-vacantes-limpias.
#
# esperado: lo que deben dar las reglas (Filtros.evaluar)
#   veredicto: aceptar | rechazar | dudosa
#   motivo / categoria / exige_modalidad: opcionales
# ia: para las dudosas que la IA acepta con una categoría; `final` es la categoría con la que
#   se publica (o "rechazar") después del guardarraíl de prácticas

