<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Computrabajo Colombia - Bolsa de trabajo, ofertas de trabajo</title></head>
<body>
<!-- candidato.co.computrabajo.com/candidate/home cuando el portal no puede escribirle al
     correo de la cuenta (2026-10-05): el enlace de Aplicar redirige aquí y no postula. El
     formulario para cambiar el correo NUNCA se debe llenar. -->
<header><a class="logo" href="https://co.computrabajo.com">Computrabajo</a><div class="info_user" data-info-user="">Ana Pérez</div></header>
<div id="MainContainer" class="container">
  <div class="overlay" change-bad-mail-overlay=""></div>

      <p class="fs24">Email incorrecto</p>
      <p>Tenemos problemas para enviar emails a ana.perez@gmail.com</p>
      <div class="field_input"><label>Añade un nuevo email</label>
        <input id="NewEmail" name="NewEmail" type="email"></div>
      <div class="btns_popup"><input type="submit" class="b_primary w50"></div>
    </div>
  </form>
  <p>Mis aplicaciones</p>
</div>
</body></html>
