<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Empleo como Auxiliar de pruebas en Bogotá | Elempleo.com</title>
<style>.hidden, .d-none { display: none !important; } .modal { display: none; }</style></head>
<body>
<!-- Banner de "ya postulado" visto al recargar la vacante justo después de postular (2026-10-15) -->
<header><a href="https://www.elempleo.com/co/Account/LogOff" class="cuenta-dropdown-link w-100 text-end">Cerrar sesión</a></header>
<main>
  <div class="alert new-alert new-alert-success js-alert-already-applied" role="alert">
    <div class="new-alert-paragraph"><span class="h3 d-block">Postulación realizada</span>
      <p>Ya te postulaste a esta oferta.</p></div>
  </div>
  <h1>Auxiliar de pruebas</h1>
  <div class="js-offer-apply-container">
    <button class="btn btn-primary btn-block aplicar-oferta-detalle js-apply-offer" type="button" data-url="/co/JobOffers/JobOfferDetail/Save?jobOfferId=PRUEBA">Postulado</button>
  </div>
</main>
</body></html>
