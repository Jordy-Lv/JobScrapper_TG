# Piloto del asistente desde la copia de desarrollo (rama asistente-postulacion-telegram),
# sin tocar el buscador de producción. Se instala en
# ~/.config/systemd/user/buscador-asistente.service.d/prueba.conf y se borra al pasar a
# producción (cuando la rama se une a main y el asistente corre desde ~/buscador-vacantes).
[Service]
WorkingDirectory=%h/buscador-asistente
